<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Tutorials - QA Automation Academy</title>
    <meta name="description" content="Search through our library of QA Automation tutorials.">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blue: {
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                },
                safelist: [
                    'bg-green-100', 'text-green-800',
                    'bg-yellow-100', 'text-yellow-800',
                    'bg-red-100', 'text-red-800'
                ]
            }
        }
    </script>
</head>

<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col min-h-screen">

    <div id="header-container"></div>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-12">
        <div class="text-center mb-12">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white sm:text-4xl">
                Search Tutorials
            </h1>
            <p class="mt-3 max-w-2xl mx-auto text-xl text-gray-500 dark:text-gray-300">
                Find exactly what you're looking for.
            </p>
        </div>

        <!-- Search & Filter Controls -->
        <div
            class="bg-gray-50 dark:bg-gray-800 p-6 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 mb-12">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Search Input -->
                <div class="md:col-span-2">
                    <label for="search-input"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search Keywords</label>
                    <input type="text" id="search-input" placeholder="e.g. xpath, java, playwright..."
                        class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md p-2">
                </div>

                <!-- Category Filter -->
                <div>
                    <label for="category-filter"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Category</label>
                    <select id="category-filter"
                        class="mt-1 block w-full py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="All">All Categories</option>
                        <option value="Java">Java</option>
                        <option value="Selenium">Selenium</option>
                        <option value="Playwright">Playwright</option>
                        <option value="UFT">UFT</option>
                        <option value="TypeScript">TypeScript</option>
                    </select>
                </div>

                <!-- Difficulty Filter -->
                <div>
                    <label for="difficulty-filter"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Difficulty</label>
                    <select id="difficulty-filter"
                        class="mt-1 block w-full py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="All">All Levels</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Results Area -->
        <div id="search-results">
            <!-- Results injected by JS -->
            <div class="flex justify-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            </div>
        </div>

    </main>

    <div id="footer-container"></div>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/search.js"></script>
</body>

</html>
